name: mamamind
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  provider: ^6.0.5
  shared_preferences: ^2.1.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.3
  internet_connection_checker: ^1.0.0+1
  youtube_player_flutter: ^9.1.2
  google_fonts: ^6.1.0
  marquee: ^2.3.0
  intl: ^0.19.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/login/
    - assets/video_player/
    - languages/

  uses-material-design: true

