name: Release Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build release APK"
        type: boolean
        default: true
      build_aab:
        description: "Build release App Bundle (AAB)"
        type: boolean
        default: true

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ── Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ── Environment file ──────────────────────────────────────────────────
      # Required secret: GEMINI_API_KEY
      - name: Create .env file
        run: echo 'GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"' > .env

      # ── google-services.json ──────────────────────────────────────────────
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # ── Android signing ───────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"    >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"          >> android/key.properties
          echo "storeFile=keystore.jks"                     >> android/key.properties

      # ── Dependencies ──────────────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
        run: flutter build apk --release

      - name: Build release App Bundle (AAB)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        run: flutter build appbundle --release

      # ── Upload build artifacts ────────────────────────────────────────────
      - name: Upload APK artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
